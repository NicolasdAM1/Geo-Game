<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Bússola Mágica</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --cor-fundo: #87CEEB;
            --cor-madeira: #8B5A2B;
            --cor-bussola: #f1c40f;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Fredoka', sans-serif;
        }

        body {
            background-color: var(--cor-fundo);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            flex-direction: column;
        }

        #tela-selecao, #tela-jogo {
            display: none;
            text-align: center;
        }

        #tela-selecao.ativo, #tela-jogo.ativo {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: white;
            text-shadow: 2px 2px 0 var(--cor-madeira);
            margin-bottom: 20px;
        }

        .container-personagens {
            display: flex;
            gap: 20px;
        }

        .card-personagem {
            background: white;
            border: 4px solid var(--cor-madeira);
            border-radius: 15px;
            padding: 20px;
            cursor: pointer;
            transition: transform 0.2s;
            width: 220px; 
            height: 220px; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            text-align: center; 
        }

        .card-personagem:hover {
            transform: scale(1.1);
        }

        /* =========================================
           SISTEMA DE SPRITES E ARTES
           ========================================= */
        .sprite {
            width: 60px;
            height: 60px;
            /* Como os 2 frames estão em coluna, a largura é 1 frame (60px) e a altura são 2 (120px) */
            background-size: 60px 120px; 
            background-repeat: no-repeat;
            background-position: 0px 0px; /* Inicia no Frame 1 (topo) */
    
            /* CORREÇÃO DE QUALIDADE: Mantém o Pixel Art nítido ao esticar */
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        .preview-personagem {
            transform: scale(1.5);
            margin-bottom: 25px;
        }

        .sprite-cachorro {
            background-image: url('../Assets/CachorroPirata.png'); /* Insira o nome correto do seu arquivo aqui */
            /* background-color: #8B4513; <- Pode apagar a cor de fundo provisória */
        }

        .sprite-gata {
            background-image: url('assets/capita-gata.png'); /* Insira o nome correto do seu arquivo aqui */
            /* background-color: #FF8C00; <- Pode apagar a cor de fundo provisória */
        }

        .sprite-tesouro {
          /* Se o tesouro tiver só 1 frame, o background-size dele deve ser 60px 60px */
            background-size: 60px 60px;
            background-image: url('assets/tesouro.png'); 
        }

        /* ========================================= */

        #ui-topo {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 400px;
            margin-bottom: 10px;
            background: rgba(255, 255, 255, 0.8);
            padding: 10px;
            border-radius: 10px;
        }

        #container-mapa {
            width: 300px;
            height: 300px;
            background-color: #e0f7fa;
            border: 8px solid var(--cor-madeira);
            border-radius: 10px;
            position: relative;
            transition: transform 1.5s ease-in-out; 
            overflow: hidden;
            box-sizing: content-box; 
        }

        .celula {
            position: absolute;
            transition: top 0.3s, left 0.3s; /* Animação de movimento pelo mapa */
        }

        #rosa-dos-ventos {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 8rem;
            opacity: 0.2;
            pointer-events: none;
        }

        #controles-bussola {
            margin-top: 20px;
            display: grid;
            grid-template-columns: 60px 60px 60px;
            grid-template-rows: 60px 60px 60px;
            gap: 5px;
            background: var(--cor-bussola);
            padding: 15px;
            border-radius: 50%;
            border: 5px solid var(--cor-madeira);
        }

        .btn-dir {
            background: white;
            border: 2px solid var(--cor-madeira);
            border-radius: 10px;
            font-size: 1.5rem;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-dir:active {
            background: #ddd;
        }

        #btn-n { grid-column: 2; grid-row: 1; }
        #btn-w { grid-column: 1; grid-row: 2; }
        #btn-e { grid-column: 3; grid-row: 2; }
        #btn-s { grid-column: 2; grid-row: 3; }

        #overlay-dialogo {
            display: none; 
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.6);
            z-index: 999;
            justify-content: center;
            align-items: center;
        }

        #overlay-dialogo.ativo {
            display: flex;
        }

        #caixa-dialogo {
            background: white;
            border: 6px solid var(--cor-madeira);
            border-radius: 15px;
            padding: 20px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            animation: zoomIn 0.3s ease-out;
        }

        @keyframes zoomIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        #papagaio-avatar {
            font-size: 4rem;
            margin-bottom: 10px;
        }

        #texto-papagaio {
            font-size: 1.2rem;
            color: #333;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        #btn-continuar {
            padding: 10px 25px;
            font-size: 1.2rem;
            font-weight: bold;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.1s;
        }

        #btn-continuar:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div id="tela-selecao" class="ativo">
        <h1>Escolha seu Capitão!</h1>
        <div class="container-personagens">
            <div class="card-personagem" onclick="iniciarJogo('sprite-cachorro')">
                <div class="sprite sprite-cachorro preview-personagem"></div>
                <h2>Capitão Cachorro</h2> 
            </div>
            <div class="card-personagem" onclick="iniciarJogo('sprite-gata')">
                <div class="sprite sprite-gata preview-personagem"></div>
                <h2>Capitã Gata</h2>
            </div>
        </div>
    </div>

    <div id="tela-jogo">
        <div id="ui-topo">
            <span id="texto-nivel">Nível 1</span>
            <span id="texto-instrucao">Chegue ao tesouro!</span>
        </div>

        <div id="container-mapa">
            <div id="rosa-dos-ventos">🧭</div>
            <div id="tesouro-obj" class="celula sprite sprite-tesouro"></div>
            <div id="jogador-obj" class="celula sprite"></div>
        </div>

        <div id="controles-bussola">
            <button id="btn-n" class="btn-dir" onclick="mover('n')">N</button>
            <button id="btn-w" class="btn-dir" onclick="mover('w')">O</button>
            <button id="btn-e" class="btn-dir" onclick="mover('e')">L</button>
            <button id="btn-s" class="btn-dir" onclick="mover('s')">S</button>
        </div>
    </div>

    <div id="overlay-dialogo">
        <div id="caixa-dialogo">
            <div id="papagaio-avatar">🦜</div>
            <p id="texto-papagaio">Arr! Mensagem do Loro!</p>
            <button id="btn-continuar" onclick="fecharDialogo()">Entendido!</button>
        </div>
    </div>

    <script>
        let nivelAtual = 1;
        let posJogador = { x: 2, y: 4 }; 
        let posTesouro = { x: 2, y: 1 };
        const tamanhoCelula = 60; 
        let mapaRotacao = 0; 
        let controlePiscar; // Guarda o temporizador da animação

        const telaSelecao = document.getElementById('tela-selecao');
        const telaJogo = document.getElementById('tela-jogo');
        const containerMapa = document.getElementById('container-mapa');
        const overlayDialogo = document.getElementById('overlay-dialogo');
        const textoPapagaio = document.getElementById('texto-papagaio');
        const textoNivel = document.getElementById('texto-nivel');

        const elJogador = document.getElementById('jogador-obj');
        const elTesouro = document.getElementById('tesouro-obj');

        function iniciarJogo(classeSprite) {
            // Aplica a classe escolhida (cachorro ou gata) ao elemento do jogador
            elJogador.className = `celula sprite ${classeSprite}`;
            
            telaSelecao.classList.remove('ativo');
            telaJogo.classList.add('ativo');
            
            carregarNivel();
            iniciarAnimacaoIdle();
        }

        // ==========================================
        // LÓGICA DA ANIMAÇÃO DE ESPERA (IDLE)
        // ==========================================
        function iniciarAnimacaoIdle() {
            // Garante que não crie múltiplos temporizadores
            if(controlePiscar) clearInterval(controlePiscar);
            
            controlePiscar = setInterval(() => {
                // Move a imagem para o Frame 2 (Olhos Fechados)
                elJogador.style.backgroundPosition = '0px -60px';
                
                // Volta para o Frame 1 (Olhos Abertos) após 1000ms
                setTimeout(() => {
                    elJogador.style.backgroundPosition = '0px 0px';
                }, 1000);
                
            }, 4000); // Executa a cada 4 segundos
        }
        // ==========================================

        function carregarNivel() {
            textoNivel.textContent = `Nível ${nivelAtual}`;
            containerMapa.style.transform = `rotate(${mapaRotacao}deg)`;

            elJogador.style.transform = `rotate(${-mapaRotacao}deg)`;
            elTesouro.style.transform = `rotate(${-mapaRotacao}deg)`;

            if (nivelAtual === 1) {
                posJogador = { x: 2, y: 4 };
                posTesouro = { x: 2, y: 0 };
            } 
            else if (nivelAtual === 2) {
                posJogador = { x: 2, y: 4 };
                posTesouro = { x: 2, y: 0 };
                mostrarDialogo("Arr, marujo! Curiosidade dos Sete Mares: só porque o tesouro está lá no Norte, não quer dizer que você tem que 'subir' de verdade. As vezes o Norte é descendo a montanha! Siga a bússola!");
            }
            else if (nivelAtual === 3) {
                posJogador = { x: 0, y: 2 };
                posTesouro = { x: 4, y: 2 };
                mapaRotacao = 90; 
                containerMapa.style.transform = `rotate(${mapaRotacao}deg)`;
                elJogador.style.transform = `rotate(${-mapaRotacao}deg)`;
                elTesouro.style.transform = `rotate(${-mapaRotacao}deg)`;
                mostrarDialogo("Uma tempestade girou o nosso mapa! Cuidado, marujo, olhe para a Rosa dos Ventos no fundo do mapa para saber onde é o Norte agora!");
            }

            atualizarPosicoesVisuais();
        }

        function mover(direcao) {
            if (direcao === 'n' && posJogador.y > 0) posJogador.y--;
            if (direcao === 's' && posJogador.y < 4) posJogador.y++;
            if (direcao === 'e' && posJogador.x < 4) posJogador.x++;
            if (direcao === 'w' && posJogador.x > 0) posJogador.x--;

            atualizarPosicoesVisuais();
            verificarVitoria();
        }

        function atualizarPosicoesVisuais() {
            elJogador.style.left = (posJogador.x * tamanhoCelula) + 'px';
            elJogador.style.top = (posJogador.y * tamanhoCelula) + 'px';
            
            elTesouro.style.left = (posTesouro.x * tamanhoCelula) + 'px';
            elTesouro.style.top = (posTesouro.y * tamanhoCelula) + 'px';
        }

        function verificarVitoria() {
            if (posJogador.x === posTesouro.x && posJogador.y === posTesouro.y) {
                setTimeout(() => {
                    if (nivelAtual < 3) {
                        nivelAtual++;
                        carregarNivel();
                    } else {
                        mostrarDialogo("Parabéns, Capitão! Você dominou a bússola! Mais aventuras em breve.");
                        // Aqui você poderia redirecionar de volta para o Hub
                    }
                }, 300);
            }
        }

        function mostrarDialogo(texto) {
            textoPapagaio.textContent = texto;
            overlayDialogo.classList.add('ativo');
        }

        function fecharDialogo() {
            overlayDialogo.classList.remove('ativo');
        }
    </script>
</body>
</html>
