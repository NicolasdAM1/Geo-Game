<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A Bússola Mágica</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --cor-fundo: #87CEEB;
            --cor-madeira: #5c4033;
            --cor-bussola: #f1c40f;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Fredoka', sans-serif;
            user-select: none; /* Evita selecionar texto ao clicar rápido */
        }

        body {
            background-color: var(--cor-fundo);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            flex-direction: column;
        }

        #tela-selecao, #tela-jogo {
            display: none;
            text-align: center;
            width: 100%;
        }

        #tela-selecao.ativo, #tela-jogo.ativo {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: white;
            text-shadow: 2px 2px 0 var(--cor-madeira);
            margin-bottom: 20px;
            font-size: 2rem;
            padding: 0 10px;
        }

        /* =========================================
           TELA DE SELEÇÃO RESPONSIVA
           ========================================= */
        .container-personagens {
            display: flex;
            justify-content: center;
            gap: 15px;
            width: 100%;
            padding: 0 20px;
        }

        .card-personagem {
            background: white;
            border: 4px solid var(--cor-madeira);
            border-radius: 15px;
            padding: 15px;
            cursor: pointer;
            transition: transform 0.2s;
            width: 45%; 
            max-width: 200px;
            aspect-ratio: 1 / 1; /* Mantém sempre quadrado */
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
        }

        .card-personagem:active {
            transform: scale(0.95);
        }

        .card-personagem h2 {
            font-size: 1.1rem;
            margin-top: 10px;
        }

        /* =========================================
           SISTEMA DE SPRITES
           ========================================= */
        .sprite {
            width: 100%;
            height: 100%;
            background-size: 100% 200%; 
            background-repeat: no-repeat;
            background-position: top; 
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        .preview-personagem {
            width: 60px;
            height: 60px;
            transform: scale(1.5);
            margin-bottom: 10px;
        }

        .sprite-cachorro {
            background-image: url('../Assets/CachorroPirata.png'); 
        }

        .sprite-gata {
            background-image: url('../Assets/GataPirata.png'); 
        }

        .sprite-tesouro {
            background-size: 100% 100%; 
            background-image: url('../Assets/X-MarksTheSpot.png'); 
        }

        /* =========================================
           UI E ESTRUTURA DO MAPA (FIXO COM WRAPPER)
           ========================================= */
        #ui-topo {
            display: flex;
            justify-content: space-between;
            width: 90vw;
            max-width: 400px;
            margin-bottom: 15px;
            background: rgba(255, 255, 255, 0.9);
            padding: 10px 15px;
            border-radius: 10px;
            border: 3px solid var(--cor-madeira);
            font-weight: bold;
        }

        /* Novo Wrapper para isolar a rotação do mapa da posição da bússola */
        #wrapper-mapa {
            position: relative;
            width: 90vw;
            max-width: 400px;
            aspect-ratio: 400 / 360;
            margin-bottom: 15px;
        }

        #container-mapa {
            width: 100%;
            height: 100%;
            background-image: url('../Assets/Background.png');
            background-size: 100% 100%; 
            background-repeat: no-repeat;

            image-rendering: pixelated;
            image-rendering: crisp-edges;

            border: 8px solid var(--cor-madeira);
            border-radius: 10px;
            position: relative;
            transition: transform 1.5s ease-in-out; 
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.3);
        }

        /* Grade visual */
        #container-mapa::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(255,255,255,0.2) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.2) 1px, transparent 1px);
            background-size: 20% 20%; 
            pointer-events: none;
        }

        .celula {
            position: absolute;
            width: 20%;  
            height: 20%; 
            transition: top 0.3s ease-out, left 0.3s ease-out; 
            z-index: 10;
        }

        /* CAIXA DA BÚSSOLA CORRIGIDA: Sempre fixa no canto superior direito */
        #indicador-norte {
            position: absolute;
            top: 15px;
            right: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.6);
            color: #ffffff;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: bold;
            pointer-events: none;
            z-index: 99; /* Fica acima de tudo */
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(2px);
        }

        /* Apenas este elemento interno vai girar para indicar o norte real */
        #seta-norte {
            display: inline-block;
            text-align: center;
            transition: transform 1.5s ease-in-out; /* Suavidade idêntica à do mapa */
        }

        #seta-norte span {
            font-size: 0.7rem;
            display: block;
            margin-top: -2px;
        }

        /* =========================================
           BÚSSOLA DE CONTROLE ESTILIZADA MINIMALISTA
           ========================================= */
        #controles-bussola {
            position: relative;
            width: 170px;
            height: 170px;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            margin-top: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.15);
            backdrop-filter: blur(4px);
        }

        #controles-bussola::before, #controles-bussola::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.2);
        }
        #controles-bussola::before { top: 0; left: 50%; width: 1px; height: 100%; }
        #controles-bussola::after { top: 50%; left: 0; width: 100%; height: 1px; }

        .agulha-centro {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 8px;
            height: 120px;
            background: linear-gradient(to bottom, #e74c3c 50%, #ffffff 50%);
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
            pointer-events: none;
            z-index: 2;
        }

        .agulha-centro::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 8px; height: 8px;
            background: #ffffff;
            border: 2px solid #e74c3c;
            border-radius: 50%;
        }

        .btn-dir {
            position: absolute;
            width: 42px; 
            height: 42px;
            background: #ffffff;
            border: none;
            border-radius: 50%;
            font-size: 1.1rem;
            cursor: pointer;
            font-weight: 600;
            transform: translate(-50%, -50%);
            color: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            transition: background 0.2s, transform 0.1s, color 0.2s;
            z-index: 5;
        }

        .btn-dir:hover {
            background: #2c3e50;
            color: #ffffff;
        }

        .btn-dir:active {
            transform: translate(-50%, -50%) scale(0.9);
            background: #1a252f;
        }

        #btn-n { top: 0%; left: 50%; }
        #btn-s { top: 100%; left: 50%; }
        #btn-w { top: 50%; left: 0%; }
        #btn-e { top: 50%; left: 100%; }

        /* ========================================= */

        #overlay-dialogo {
            display: none; 
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.7);
            z-index: 999;
            justify-content: center; align-items: center;
            padding: 20px;
        }

        #overlay-dialogo.ativo { display: flex; }

        #caixa-dialogo {
            background: white;
            border: 6px solid var(--cor-madeira);
            border-radius: 15px;
            padding: 20px;
            width: 100%;
            max-width: 350px;
            text-align: center;
            animation: zoomIn 0.3s ease-out;
        }

        @keyframes zoomIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        #papagaio-avatar { font-size: 4rem; margin-bottom: 10px; }
        #texto-papagaio { font-size: 1.2rem; color: #333; margin-bottom: 20px; }
        #btn-continuar {
            padding: 10px 25px;
            font-size: 1.2rem;
            font-weight: bold;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="tela-selecao" class="ativo">
        <h1>Escolha seu Capitão!</h1>
        <div class="container-personagens">
            <div class="card-personagem" onclick="iniciarJogo('sprite-cachorro')">
                <div class="sprite sprite-cachorro preview-personagem"></div>
                <h2>Capitão Cachorro</h2> 
            </div>
            <div class="card-personagem" onclick="iniciarJogo('sprite-gata')">
                <div class="sprite sprite-gata preview-personagem"></div>
                <h2>Capitã Gata</h2>
            </div>
        </div>
    </div>

    <div id="tela-jogo">
        <div id="ui-topo">
            <span id="texto-nivel">Nível 1</span>
            <span id="texto-instrucao">Ache o tesouro!</span>
        </div>

        <div id="wrapper-mapa">
            <div id="indicador-norte" title="Indicação do Norte">
                <div id="seta-norte">▲<br><span>N</span></div>
            </div>
            
            <div id="container-mapa">
                <div id="tesouro-obj" class="celula sprite sprite-tesouro"></div>
                <div id="jogador-obj" class="celula sprite"></div>
            </div>
        </div>

        <div id="controles-bussola">
            <div class="agulha-centro"></div>
            <button id="btn-n" class="btn-dir" onclick="mover('n')">N</button>
            <button id="btn-w" class="btn-dir" onclick="mover('w')">O</button>
            <button id="btn-e" class="btn-dir" onclick="mover('e')">L</button>
            <button id="btn-s" class="btn-dir" onclick="mover('s')">S</button>
        </div>
    </div>

    <div id="overlay-dialogo">
        <div id="caixa-dialogo">
            <div id="papagaio-avatar">🦜</div>
            <p id="texto-papagaio">Arr! Mensagem do Loro!</p>
            <button id="btn-continuar" onclick="fecharDialogo()">Entendido!</button>
        </div>
    </div>

    <script>
        let nivelAtual = 1;
        let posJogador = { x: 2, y: 4 }; 
        let posTesouro = { x: 0, y: 0 };
        let mapaRotacao = 0; 
        let controlePiscar;

        const telaSelecao = document.getElementById('tela-selecao');
        const telaJogo = document.getElementById('tela-jogo');
        const containerMapa = document.getElementById('container-mapa');
        const setaNorte = document.getElementById('seta-norte');
        const overlayDialogo = document.getElementById('overlay-dialogo');
        const textoPapagaio = document.getElementById('texto-papagaio');
        const textoNivel = document.getElementById('texto-nivel');

        const elJogador = document.getElementById('jogador-obj');
        const elTesouro = document.getElementById('tesouro-obj');

        function iniciarJogo(classeSprite) {
            elJogador.className = `celula sprite ${classeSprite}`;
            telaSelecao.classList.remove('ativo');
            telaJogo.classList.add('ativo');
            
            carregarNivel();
            iniciarAnimacaoIdle();
        }

        function iniciarAnimacaoIdle() {
            if(controlePiscar) clearInterval(controlePiscar);
            
            controlePiscar = setInterval(() => {
                elJogador.style.backgroundPosition = 'bottom';
                
                setTimeout(() => {
                    elJogador.style.backgroundPosition = 'top';
                }, 1000);
                
            }, 4000); 
        }

        function sortearTesouro() {
            do {
                posTesouro.x = Math.floor(Math.random() * 5); 
                posTesouro.y = Math.floor(Math.random() * 5); 
            } while (posTesouro.x === posJogador.x && posTesouro.y === posJogador.y);
        }

        function carregarNivel() {
            textoNivel.textContent = `Nível ${nivelAtual}`;

            if (nivelAtual === 1 || nivelAtual === 2) {
                posJogador = { x: 2, y: 4 };
                mapaRotacao = 0;
            } else if (nivelAtual === 3) {
                posJogador = { x: 0, y: 2 };
                mapaRotacao = 90; 
            }

            atualizarRotacoesVisuais();
            sortearTesouro();

            if (nivelAtual === 2) {
                mostrarDialogo("Arr, marujo! Curiosidade: o tesouro está em um novo lugar. Lembra que descer a montanha também pode ser ir pro Norte!");
            } else if (nivelAtual === 3) {
                mostrarDialogo("Tempestade à vista! O mapa girou. Olhe a indicação de Norte no canto para não se perder!");
            }

            atualizarPosicoesVisuais();
        }

        function atualizarRotacoesVisuais() {
            containerMapa.style.transform = `rotate(${mapaRotacao}deg)`;
            elJogador.style.transform = `rotate(${-mapaRotacao}deg)`;
            elTesouro.style.transform = `rotate(${-mapaRotacao}deg)`;
            
            // CORREÇÃO: A seta interna gira com o mapa para apontar exatamente onde o Norte real está agora!
            setaNorte.style.transform = `rotate(${mapaRotacao}deg)`;
        }

        function mover(direcao) {
            if (direcao === 'n' && posJogador.y > 0) posJogador.y--;
            if (direcao === 's' && posJogador.y < 4) posJogador.y++;
            if (direcao === 'e' && posJogador.x < 4) posJogador.x++;
            if (direcao === 'w' && posJogador.x > 0) posJogador.x--;

            atualizarPosicoesVisuais();
            verificarVitoria();
        }

        function atualizarPosicoesVisuais() {
            elJogador.style.left = (posJogador.x * 20) + '%';
            elJogador.style.top = (posJogador.y * 20) + '%';
            
            elTesouro.style.left = (posTesouro.x * 20) + '%';
            elTesouro.style.top = (posTesouro.y * 20) + '%';
        }

        function verificarVitoria() {
            if (posJogador.x === posTesouro.x && posJogador.y === posTesouro.y) {
                setTimeout(() => {
                    if (nivelAtual < 3) {
                        nivelAtual++;
                        carregarNivel();
                    } else {
                        mostrarDialogo("Parabéns, Capitão! Você dominou a bússola! O jogo vai recomeçar.");
                        setTimeout(() => {
                            nivelAtual = 1;
                            mapaRotacao = 0;
                            telaJogo.classList.remove('ativo');
                            telaSelecao.classList.add('ativo');
                        }, 3000);
                    }
                }, 300);
            }
        }

        function mostrarDialogo(texto) {
            textoPapagaio.textContent = texto;
            overlayDialogo.classList.add('ativo');
        }

        function fecharDialogo() {
            overlayDialogo.classList.remove('ativo');
        }
    </script>
</body>
</html>
